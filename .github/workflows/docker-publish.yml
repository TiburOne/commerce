name: Docker Image CI

on:
  push:
    branches:
      - main  # Cambia esto a la rama que desees usar

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout del código del repositorio
      - name: Checkout code
        uses: actions/checkout@v2

      # Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Iniciar sesión en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construir y subir la imagen Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/commerce-app:latest
          build-args:  # Pasar variables de entorno como argumentos de construcción
            DB_NAME: ${{ secrets.DB_NAME }}
            DB_USER: ${{ secrets.DB_USER }}
            DB_PASS: ${{ secrets.DB_PASS }}
            DB_HOST: ${{ secrets.DB_HOST }}
            DB_DIALECT: ${{ secrets.DB_DIALECT }}
            DB_PORT: ${{ secrets.DB_PORT }}
            DB_LOGGING: ${{ secrets.DB_LOGGING }}
            DB_SSL: ${{ secrets.DB_SSL }}