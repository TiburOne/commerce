name: Docker Image CI

# Define cuándo se debe ejecutar el workflow
on:
  push:
    branches:
      - transporte  # Cambia esto a la rama que desees

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout del código del repositorio
      - name: Checkout code
        uses: actions/checkout@v2

      # Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Iniciar sesión en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construir y subir la imagen Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .  # Contexto del build, usualmente el directorio raíz
          push: true  # Permitir que la imagen se publique en Docker Hub
          tags: ${{ secrets.DOCKER_USERNAME }}/commerce-app:latest
