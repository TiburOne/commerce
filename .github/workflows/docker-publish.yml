name: Docker Image CI

on:
  push:
    branches:
      - transporte  # Cambia esto a la rama que desees usar
      - transporte  # Cambia esto a la rama que desees usar

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout del código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4  # Actualizado a v4

      # Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # Actualizado a v3

      # Iniciar sesión en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3  # Actualizado a v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construir y subir la imagen Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5  # Actualizado a v5
        with:
          context: .  # Directorio actual como contexto de construcción
          push: true  # Permitir que la imagen se publique en Docker Hub
          tags: ${{ secrets.DOCKER_USERNAME }}/commerce-app:latest
          build-args:  # Pasar variables de entorno como argumentos de construcción
            -DB_NAME= ${{ secrets.DB_NAME }}
            -DB_USER= ${{ secrets.DB_USER }}
            -DB_PASS= ${{ secrets.DB_PASS }}
            -DB_HOST= ${{ secrets.DB_HOST }}
            -DB_DIALECT= ${{ secrets.DB_DIALECT }}
            -DB_PORT= ${{ secrets.DB_PORT }}
            -DB_LOGGING= ${{ secrets.DB_LOGGING }}
            -DB_SSL= ${{ secrets.DB_SSL }}
